<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KlickSpiel</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111;
      color:white;
      text-align:center;
      overflow-y:auto;
    }

    h1{
      margin-top:20px;
      font-size:40px;
    }

    .stats{
      font-size:22px;
      margin:10px;
    }

    #clickBtn{
      margin-top:30px;
      width:200px;
      height:200px;
      border-radius:50%;
      border:none;
      font-size:25px;
      background:#00bfff;
      color:white;
      cursor:pointer;
    }

    #clickBtn:hover{
      transform:scale(1.05);
    }

    .shop{
      margin:40px auto;
      width:500px;
      background:#1c1c1c;
      padding:20px;
      border-radius:15px;
    }

    .item{
      background:#2a2a2a;
      padding:15px;
      margin:10px;
      border-radius:10px;
    }

    button{
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
    }

    .buy{ background:green; }
    .use{ background:orange; }
    .reset{ background:red; margin-top:20px; }

    /* DVD LOGO */
    #dvd{
      position:fixed;
      top:100px;
      left:100px;
      width:100px;
      height:50px;
      background:red;
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:bold;
      border-radius:10px;
      pointer-events:none;
    }
  </style>
</head>

<body>

  <!-- DVD -->
  <div id="dvd">DVD</div>

  <h1>⛏ KlickSpiel</h1>

  <div class="stats">
    Punkte: <span id="score">0</span>
  </div>

  <div class="stats">
    Multiplikator: x<span id="multi">1</span>
  </div>

  <button id="clickBtn" onclick="clickGame()">KLICK</button>

  <div class="shop">

    <h2>🛒 Shop</h2>

    <div class="item">
      <p>🏹 Bogen (3x Nutzung) - 100 Punkte</p>
      <button class="buy" onclick="buyBow()">Kaufen</button>
      <button class="use" onclick="useBow()">Benutzen</button>
      <p>Bow: <span id="bows">0</span></p>
    </div>

    <button class="reset" onclick="resetGame()">Reset</button>

  </div>

<script>

let score = 0;
let clicks = 0;
let multi = 1;
let bows = 0;

function clickGame(){
  clicks++;
  score += multi;

  if(clicks % 10 === 0){
    multi *= 2;
  }

  update();
}

function buyBow(){
  if(score >= 100){
    score -= 100;
    bows += 3;
    update();
  } else {
    alert("Nicht genug Punkte!");
  }
}

function useBow(){
  if(bows > 0){
    bows--;
    score += 250;
    update();
  } else {
    alert("Kein Bogen mehr!");
  }
}

function resetGame(){
  score = 0;
  clicks = 0;
  multi = 1;
  bows = 0;
  update();
}

function update(){
  document.getElementById("score").innerText = score;
  document.getElementById("multi").innerText = multi;
  document.getElementById("bows").innerText = bows;
}

/* DVD LOGO */
const dvd = document.getElementById("dvd");

let x = 100;
let y = 100;
let sx = 3;
let sy = 3;

function moveDVD(){
  x += sx;
  y += sy;

  if(x + dvd.offsetWidth > window.innerWidth || x < 0){
    sx *= -1;
  }

  if(y + dvd.offsetHeight > window.innerHeight || y < 0){
    sy *= -1;
  }

  dvd.style.left = x + "px";
  dvd.style.top = y + "px";

  requestAnimationFrame(moveDVD);
}

moveDVD();

</script>

</body>
</html>
