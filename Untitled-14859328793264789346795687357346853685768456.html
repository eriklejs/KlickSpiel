<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Klick Spiel</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111;
      color:white;
      text-align:center;
      overflow-y:auto; /* <- SCROLLEN AN */
    }

    h1{
      margin-top:20px;
      font-size:45px;
    }

    .score{
      font-size:35px;
      margin:20px;
    }

    .multi{
      font-size:25px;
      color:#00ff99;
    }

    #clickBtn{
      margin-top:30px;
      width:220px;
      height:220px;
      border-radius:50%;
      border:none;
      font-size:30px;
      background:#00bfff;
      color:white;
      cursor:pointer;
      transition:0.2s;
      position:relative;
    }

    #clickBtn:hover{
      transform:scale(1.05);
    }

    .shop{
      margin-top:40px;
      background:#1c1c1c;
      width:500px;
      margin-left:auto;
      margin-right:auto;
      padding:20px;
      border-radius:20px;
    }

    .item{
      background:#2a2a2a;
      margin:15px;
      padding:15px;
      border-radius:15px;
    }

    .buy-btn, .use-btn, .reset-btn{
      padding:12px 20px;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      color:white;
      margin-top:10px;
    }

    .buy-btn{ background:#00aa55; }
    .use-btn{ background:orange; }
    .reset-btn{ background:red; margin-top:30px; }

    .inventory{
      margin-top:20px;
      font-size:22px;
    }

    .arrow{
      position:absolute;
      font-size:40px;
      left:-100px;
      top:45%;
      animation:shoot 0.8s linear forwards;
    }

    @keyframes shoot{
      from{ left:-100px; }
      to{ left:50%; }
    }

    /* DVD LOGO */
    #dvd{
      position:fixed;
      top:100px;
      left:100px;
      width:120px;
      height:60px;
      background:red;
      color:white;
      font-size:30px;
      font-weight:bold;
      display:flex;
      justify-content:center;
      align-items:center;
      border-radius:15px;
      pointer-events:none;
      z-index:9999;
    }

  </style>
</head>

<body>

  <!-- DVD -->
  <div id="dvd">DVD</div>

  <h1>⛏ Minecraft Klick Spiel</h1>

  <div class="score">
    Punkte: <span id="score">0</span>
  </div>

  <div class="multi">
    Multiplikator: x<span id="multi">1</span>
  </div>

  <button id="clickBtn" onclick="clickGame()">🎯 KLICK</button>

  <div class="shop">

    <h2>🛒 Shop</h2>

    <div class="item">
      <h3>🏹 Bogen + Pfeil</h3>
      <p>Preis: 100 Punkte</p>
      <p>3x benutzbar</p>

      <button class="buy-btn" onclick="buyBow()">Kaufen</button>
      <button class="use-btn" onclick="useBow()">Pfeil schießen</button>
    </div>

    <div class="inventory">
      Pfeile übrig: <span id="bows">0</span>
    </div>

    <button class="reset-btn" onclick="resetGame()">🔄 Reset</button>

  </div>

<script>

  let score = 0;
  let clicks = 0;
  let multiplier = 1;
  let bows = 0;

  function clickGame(){
    clicks++;
    score += multiplier;

    if(clicks % 10 === 0){
      multiplier *= 2;
    }

    updateUI();
  }

  function buyBow(){
    if(score >= 100){
      score -= 100;
      bows += 3;
      updateUI();
    } else {
      alert("Nicht genug Punkte!");
    }
  }

  function useBow(){
    if(bows > 0){
      bows--;
      score += 250;

      const arrow = document.createElement("div");
      arrow.classList.add("arrow");
      arrow.innerHTML = "🏹➜";
      document.body.appendChild(arrow);

      setTimeout(() => arrow.remove(), 800);

      updateUI();
    } else {
      alert("Keine Pfeile mehr!");
    }
  }

  function resetGame(){
    score = 0;
    clicks = 0;
    multiplier = 1;
    bows = 0;
    updateUI();
  }

  function updateUI(){
    document.getElementById("score").innerText = score;
    document.getElementById("multi").innerText = multiplier;
    document.getElementById("bows").innerText = bows;
  }

  // DVD Animation
  const dvd = document.getElementById("dvd");

  let x = 100;
  let y = 100;
  let speedX = 3;
  let speedY = 3;

  function randomColor(){
    const colors = ["red","blue","lime","yellow","purple","orange","cyan","pink"];
    return colors[Math.floor(Math.random()*colors.length)];
  }

  function moveDVD(){
    x += speedX;
    y += speedY;

    if(x + dvd.offsetWidth >= window.innerWidth || x <= 0){
      speedX *= -1;
      dvd.style.background = randomColor();
    }

    if(y + dvd.offsetHeight >= window.innerHeight || y <= 0){
      speedY *= -1;
      dvd.style.background = randomColor();
    }

    dvd.style.left = x + "px";
    dvd.style.top = y + "px";

    requestAnimationFrame(moveDVD);
  }

  moveDVD();

</script>

</body>
</html>
